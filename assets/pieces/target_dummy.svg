<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" shape-rendering="crispEdges">
  <defs>
    <!-- Aura Ring Glow -->
    <filter id="dummyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ground Drop Shadow -->
  <ellipse cx="60" cy="110" rx="32" ry="7" fill="rgba(0, 0, 0, 0.65)" />

  <!-- Runic Faction Floor Ring (Neutral/Training Amber) -->
  <ellipse cx="60" cy="110" rx="28" ry="6" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.8" filter="url(#dummyGlow)" />
  <circle cx="60" cy="110" r="1.5" fill="#fde047" />
  <circle cx="34" cy="110" r="1.5" fill="#fde047" />
  <circle cx="86" cy="110" r="1.5" fill="#fde047" />

  <!-- Base Wooden Post / Stand -->
  <rect x="56" y="92" width="8" height="18" fill="#451a03" />
  <rect x="58" y="94" width="4" height="16" fill="#78350f" />
  <rect x="42" y="104" width="36" height="5" fill="#3b1d11" />
  <rect x="44" y="105" width="32" height="3" fill="#78350f" />

  <!-- Straw & Wooden Torso Body -->
  <rect x="48" y="52" width="24" height="42" fill="#78350f" rx="3" />
  <rect x="50" y="54" width="20" height="38" fill="#b45309" rx="2" />
  <!-- Straw texture bands -->
  <rect x="52" y="58" width="16" height="4" fill="#fde047" opacity="0.8" />
  <rect x="52" y="68" width="16" height="4" fill="#fde047" opacity="0.8" />
  <rect x="52" y="78" width="16" height="4" fill="#fde047" opacity="0.8" />
  <!-- Binding ropes -->
  <rect x="48" y="62" width="24" height="3" fill="#451a03" />
  <rect x="48" y="72" width="24" height="3" fill="#451a03" />
  <rect x="48" y="82" width="24" height="3" fill="#451a03" />

  <!-- Crossbeam Arms (Wooden beam through shoulders) -->
  <rect x="22" y="56" width="76" height="8" fill="#451a03" rx="2" />
  <rect x="24" y="58" width="72" height="4" fill="#92400e" rx="1" />
  <!-- Arm Straw Bundles -->
  <rect x="18" y="54" width="8" height="12" fill="#fde047" rx="2" />
  <rect x="94" y="54" width="8" height="12" fill="#fde047" rx="2" />
  <rect x="20" y="58" width="4" height="4" fill="#78350f" />
  <rect x="96" y="58" width="4" height="4" fill="#78350f" />

  <!-- Chest Target Bullseye Plate -->
  <circle cx="60" cy="72" r="14" fill="#dc2626" stroke="#451a03" stroke-width="2" />
  <circle cx="60" cy="72" r="10" fill="#f8fafc" />
  <circle cx="60" cy="72" r="6" fill="#dc2626" />
  <circle cx="60" cy="72" r="2.5" fill="#fde047" />

  <!-- Dummy Head (Stuffed Sack with stitched eyes) -->
  <rect x="50" y="24" width="20" height="26" fill="#78350f" rx="6" />
  <rect x="52" y="26" width="16" height="22" fill="#d97706" rx="4" />
  <!-- Stitching and patches -->
  <rect x="54" y="32" width="3" height="3" fill="#451a03" />
  <rect x="63" y="32" width="3" height="3" fill="#451a03" />
  <!-- Stitched Cross Eyes (X X) -->
  <path d="M54,32 L57,35 M57,32 L54,35" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  <path d="M63,32 L66,35 M66,32 L63,35" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  <!-- Stitched Mouth -->
  <path d="M56,41 L64,41" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
  <path d="M58,40 L58,42 M60,40 L60,42 M62,40 L62,42" stroke="#1e293b" stroke-width="1" />

  <!-- Training Helmet / Straw Top Knot -->
  <path d="M50,26 Q60,14 70,26 Z" fill="#92400e" />
  <rect x="57" y="16" width="6" height="10" fill="#fde047" rx="2" />
  <rect x="58" y="14" width="4" height="4" fill="#d97706" />

  <!-- Battle Nick & Sparks -->
  <circle cx="38" cy="50" r="1.5" fill="#fde047" opacity="0.9" />
  <circle cx="82" cy="52" r="1.5" fill="#fde047" opacity="0.9" />
</svg>
