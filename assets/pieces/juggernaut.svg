<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56" width="256" height="256" shape-rendering="crispEdges">
  <defs>
    <filter id="primalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#84cc16" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- DUELYST II: PRIMAL BEHEMOTH (JUGGERNAUT - MAGMAR FACTION) - HI-BIT PIXEL SPRITE -->

  <!-- Armored Reptilian Spikes along Back -->
  <g fill="#14532d" filter="url(#primalGlow)">
    <polygon points="12,18 8,12 14,14"/>
    <polygon points="36,18 40,12 34,14"/>
    <polygon points="24,8 24,2 26,8"/>
  </g>

  <!-- Massive Armored Dinosaur Shoulders -->
  <g fill="#166534">
    <rect x="8" y="18" width="9" height="9"/>
    <rect x="9" y="19" width="7" height="7" fill="#22c55e"/>
    <rect x="31" y="18" width="9" height="9"/>
    <rect x="32" y="19" width="7" height="7" fill="#22c55e"/>
  </g>

  <!-- Primal Carapace Chest with Glowing Magmar Heart -->
  <g fill="#14532d">
    <rect x="16" y="16" width="16" height="18"/>
    <rect x="18" y="15" width="12" height="20" fill="#166534"/>
  </g>
  <!-- Glowing Primal Acid / Magma Core -->
  <g fill="#84cc16" filter="url(#primalGlow)">
    <rect x="22" y="22" width="4" height="6"/>
    <rect x="23" y="23" width="2" height="4" fill="#facc15"/>
  </g>

  <!-- Heavy Saurian Claws -->
  <g fill="#166534">
    <rect x="9" y="27" width="5" height="10"/>
    <rect x="8" y="36" width="7" height="6" fill="#14532d"/>
    <rect x="34" y="27" width="5" height="10"/>
    <rect x="33" y="36" width="7" height="6" fill="#14532d"/>
  </g>

  <!-- Horned Lizard Skull Head & Flaming Green Eyes -->
  <g fill="#15803d">
    <rect x="20" y="8" width="8" height="9"/>
    <rect x="19" y="9" width="10" height="7" fill="#166534"/>
    <polygon points="18,8 14,4 19,6" fill="#14532d"/>
    <polygon points="30,8 34,4 29,6" fill="#14532d"/>
  </g>
  <rect x="21" y="11" width="2" height="1.5" fill="#a3e635" filter="url(#primalGlow)"/>
  <rect x="25" y="11" width="2" height="1.5" fill="#a3e635" filter="url(#primalGlow)"/>

  <!-- Heavy Dinosaur Stomp Feet -->
  <g fill="#14532d">
    <rect x="16" y="34" width="6" height="14"/>
    <rect x="15" y="46" width="8" height="5"/>
    <rect x="26" y="34" width="6" height="14"/>
    <rect x="25" y="46" width="8" height="5"/>
  </g>
</svg>