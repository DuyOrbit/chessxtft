<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56" width="256" height="256" shape-rendering="crispEdges">
  <defs>
    <filter id="solarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- DUELYST II: CELESTIAL SOLAR INVOKER (PYRO BISHOP - LYONAR FACTION) - HI-BIT PIXEL SPRITE -->

  <!-- Towering Solar Crystal Staff on Right Hand -->
  <g filter="url(#solarGlow)">
    <!-- Staff Rod (Polished Gold & Mahogany) -->
    <rect x="36" y="14" width="2" height="38" fill="#ca8a04"/>
    <rect x="37" y="14" width="1" height="38" fill="#fef08a"/>
    <!-- Staff Head Winged Prongs -->
    <rect x="34" y="8" width="2" height="7" fill="#fde047"/>
    <rect x="38" y="8" width="2" height="7" fill="#fde047"/>
    <rect x="33" y="10" width="8" height="2" fill="#ca8a04"/>
    <!-- Floating Solar Gemstone Orb -->
    <circle cx="37" cy="6" r="3.5" fill="#f59e0b"/>
    <circle cx="37" cy="6" r="2.2" fill="#fde047"/>
    <circle cx="37" cy="6" r="1.1" fill="#ffffff"/>
  </g>

  <!-- Flowing White Silk Robe with Golden Faction Stole -->
  <g fill="#f8fafc">
    <rect x="18" y="24" width="12" height="22"/>
    <rect x="16" y="34" width="16" height="15"/>
    <rect x="14" y="44" width="20" height="7"/>
  </g>
  <!-- Robe Shading -->
  <g fill="#cbd5e1">
    <rect x="18" y="32" width="3" height="18"/>
    <rect x="27" y="32" width="3" height="18"/>
  </g>
  <!-- Golden Emblazoned Stole down the center -->
  <g fill="#f59e0b">
    <rect x="21" y="22" width="6" height="26"/>
    <rect x="22" y="24" width="4" height="22" fill="#fde047"/>
    <!-- Solar Cross Emblems -->
    <rect x="23" y="26" width="2" height="4" fill="#78350f"/>
    <rect x="22" y="27" width="4" height="2" fill="#78350f"/>
    <rect x="23" y="36" width="2" height="4" fill="#78350f"/>
    <rect x="22" y="37" width="4" height="2" fill="#78350f"/>
  </g>

  <!-- Robe Sleeves -->
  <g fill="#f8fafc">
    <rect x="14" y="24" width="5" height="10"/>
    <rect x="29" y="24" width="5" height="10"/>
  </g>

  <!-- Dignified Robed Head / Hood / Halo -->
  <g fill="#fde047" filter="url(#solarGlow)">
    <circle cx="24" cy="12" r="7.5" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <!-- Monk Head with Shaved Temples & Kind Eyes -->
  <rect x="20" y="12" width="8" height="9" fill="#fed7aa"/>
  <rect x="21" y="13" width="6" height="7" fill="#ffedd5"/>
  <rect x="21" y="16" width="2" height="1.5" fill="#38bdf8"/>
  <rect x="25" y="16" width="2" height="1.5" fill="#38bdf8"/>

  <!-- Left Hand Raised Casting Light Spell -->
  <g fill="#fed7aa">
    <rect x="12" y="28" width="4" height="4"/>
  </g>
  <circle cx="14" cy="27" r="2.2" fill="#fde047" filter="url(#solarGlow)"/>
  <circle cx="14" cy="27" r="1.1" fill="#ffffff"/>

  <!-- Right Hand Gripping Solar Staff -->
  <rect x="34" y="26" width="4" height="4" fill="#fed7aa"/>
</svg>