<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56" width="256" height="256" shape-rendering="crispEdges">
  <defs>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#f59e0b" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- DUELYST II: SHADOW TRICKSTER (GAMBLER) - HI-BIT PIXEL BATTLE SPRITE -->

  <!-- Floating Golden Lucky Dices spinning in hand -->
  <g transform="translate(8, 22)" filter="url(#goldGlow)">
    <rect x="0" y="0" width="7" height="7" fill="#fde047"/>
    <rect x="1" y="1" width="5" height="5" fill="#f59e0b"/>
    <rect x="2" y="2" width="1" height="1" fill="#78350f"/>
    <rect x="4" y="4" width="1" height="1" fill="#78350f"/>
  </g>
  <g transform="translate(13, 14)" filter="url(#goldGlow)">
    <rect x="0" y="0" width="5" height="5" fill="#fef08a"/>
    <rect x="1" y="1" width="3" height="3" fill="#ca8a04"/>
  </g>

  <!-- Shrouded Rogue Cowl & Mask -->
  <g fill="#1e1b4b">
    <rect x="20" y="13" width="9" height="9"/>
    <rect x="19" y="14" width="11" height="7"/>
    <rect x="22" y="11" width="5" height="3" fill="#312e81"/>
  </g>
  <!-- Glowing Amber Rogue Eyes -->
  <rect x="22" y="17" width="2" height="1.5" fill="#f59e0b" filter="url(#goldGlow)"/>
  <rect x="25" y="17" width="2" height="1.5" fill="#f59e0b" filter="url(#goldGlow)"/>

  <!-- Leather Tunic with Throwing Daggers -->
  <g fill="#312e81">
    <rect x="20" y="22" width="9" height="12"/>
    <rect x="21" y="23" width="7" height="10" fill="#4338ca"/>
    <!-- Gold Dagger Sheaths -->
    <rect x="22" y="28" width="2" height="6" fill="#f59e0b"/>
    <rect x="25" y="28" width="2" height="6" fill="#f59e0b"/>
  </g>

  <!-- Right Hand with Gilded Throwing Dagger -->
  <rect x="31" y="25" width="4" height="6" fill="#4338ca"/>
  <rect x="32" y="20" width="2" height="12" fill="#e2e8f0"/>
  <rect x="32" y="18" width="2" height="3" fill="#ffffff" filter="url(#goldGlow)"/>

  <!-- Stealth Boots & Stance -->
  <g fill="#1e1b4b">
    <rect x="20" y="34" width="4" height="14"/>
    <rect x="19" y="46" width="6" height="4"/>
    <rect x="26" y="34" width="4" height="14"/>
    <rect x="25" y="46" width="6" height="4"/>
  </g>
</svg>