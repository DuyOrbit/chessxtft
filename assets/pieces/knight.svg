<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56" width="256" height="256" shape-rendering="crispEdges">
  <defs>
    <filter id="knightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#38bdf8" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- DUELYST II: SILVERGUARD KNIGHT (KNIGHT) - HI-BIT PIXEL BATTLE SPRITE -->

  <!-- Giant Tower Kite Shield on Left Hand -->
  <g filter="url(#knightGlow)">
    <!-- Shield Rim & Base -->
    <polygon points="6,20 18,20 17,44 12,49 7,44" fill="#0f172a"/>
    <polygon points="7,21 17,21 16,43 12,47 8,43" fill="#334155"/>
    <polygon points="8,22 16,22 15,41 12,44 9,41" fill="#64748b"/>
    <!-- Glowing Blue Solar Cross on Shield -->
    <rect x="11" y="24" width="2" height="16" fill="#38bdf8"/>
    <rect x="8" y="28" width="8" height="2" fill="#38bdf8"/>
    <rect x="11.5" y="28.5" width="1" height="1" fill="#ffffff"/>
  </g>

  <!-- Armored Knight Body (Full Plate) -->
  <!-- Helmet with Golden Wings -->
  <!-- Wing Feathers on Helmet -->
  <g fill="#f59e0b">
    <rect x="19" y="10" width="2" height="4"/>
    <rect x="29" y="10" width="2" height="4"/>
    <rect x="23" y="8" width="4" height="2"/>
  </g>
  <!-- Steel Great-Helm Base -->
  <rect x="21" y="12" width="8" height="9" fill="#94a3b8"/>
  <rect x="20" y="13" width="10" height="7" fill="#64748b"/>
  <!-- Glowing Cyan Visor T-Slit -->
  <rect x="22" y="15" width="6" height="2" fill="#38bdf8" filter="url(#knightGlow)"/>
  <rect x="24" y="15" width="2" height="4" fill="#38bdf8" filter="url(#knightGlow)"/>
  <rect x="24.5" y="15.5" width="1" height="1" fill="#ffffff"/>

  <!-- Steel Pauldrons (Shoulders) -->
  <rect x="17" y="20" width="6" height="6" fill="#94a3b8"/>
  <rect x="27" y="20" width="7" height="6" fill="#94a3b8"/>
  <rect x="28" y="21" width="5" height="4" fill="#cbd5e1"/>

  <!-- Steel Chestplate with Gold Trim -->
  <rect x="21" y="21" width="8" height="11" fill="#64748b"/>
  <rect x="22" y="22" width="6" height="9" fill="#94a3b8"/>
  <rect x="24" y="24" width="2" height="3" fill="#f59e0b"/>

  <!-- Right Arm wielding Broadsword -->
  <rect x="31" y="25" width="4" height="7" fill="#64748b"/>
  <rect x="32" y="32" width="3" height="3" fill="#cbd5e1"/>
  <!-- Gleaming Steel Broadsword in Hand -->
  <rect x="35" y="31" width="6" height="2" fill="#ca8a04"/>
  <rect x="37" y="12" width="2" height="20" fill="#cbd5e1"/>
  <rect x="37.5" y="10" width="1" height="22" fill="#ffffff"/>
  <rect x="37" y="33" width="2" height="4" fill="#475569"/>

  <!-- Armored Greaves & Plate Boots -->
  <g fill="#475569">
    <rect x="20" y="35" width="5" height="13"/>
    <rect x="21" y="36" width="3" height="11" fill="#64748b"/>
    <rect x="19" y="48" width="6" height="4" fill="#334155"/>
    <rect x="26" y="35" width="5" height="13"/>
    <rect x="27" y="36" width="3" height="11" fill="#64748b"/>
    <rect x="26" y="48" width="6" height="4" fill="#334155"/>
  </g>
</svg>