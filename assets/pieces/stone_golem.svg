<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56" width="256" height="256" shape-rendering="crispEdges">
  <defs>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#38bdf8" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- DUELYST II: ARCANITE RUNIC GOLEM (STONE GOLEM / ROOK) - HI-BIT PIXEL SPRITE -->

  <!-- Giant Boulder Shoulders (Pauldrons) -->
  <!-- Left Shoulder -->
  <g fill="#475569">
    <rect x="8" y="16" width="9" height="9"/>
    <rect x="9" y="15" width="7" height="11"/>
    <rect x="10" y="17" width="5" height="7" fill="#64748b"/>
  </g>
  <!-- Right Shoulder -->
  <g fill="#475569">
    <rect x="31" y="16" width="9" height="9"/>
    <rect x="32" y="15" width="7" height="11"/>
    <rect x="33" y="17" width="5" height="7" fill="#64748b"/>
  </g>

  <!-- Massive Stone Chest / Torso -->
  <g fill="#334155">
    <rect x="16" y="16" width="16" height="18"/>
    <rect x="18" y="15" width="12" height="20"/>
    <rect x="17" y="17" width="14" height="16" fill="#475569"/>
  </g>

  <!-- Glowing Arcanite Rune Conduits on Chest & Shoulders -->
  <g fill="#38bdf8" filter="url(#cyanGlow)">
    <!-- Central Power Core Gem -->
    <rect x="22" y="22" width="4" height="5"/>
    <rect x="23" y="23" width="2" height="3" fill="#ffffff"/>
    <!-- Energy Channel Lines radiating out -->
    <rect x="20" y="24" width="2" height="1"/>
    <rect x="26" y="24" width="2" height="1"/>
    <rect x="19" y="22" width="1" height="4"/>
    <rect x="28" y="22" width="1" height="4"/>
    <rect x="23" y="27" width="2" height="4"/>
    <!-- Shoulder Runes -->
    <rect x="12" y="19" width="3" height="3"/>
    <rect x="13" y="20" width="1" height="1" fill="#ffffff"/>
    <rect x="33" y="19" width="3" height="3"/>
    <rect x="34" y="20" width="1" height="1" fill="#ffffff"/>
  </g>

  <!-- Heavy Stone Automaton Arms & Fists -->
  <!-- Left Arm -->
  <g fill="#334155">
    <rect x="9" y="25" width="6" height="12"/>
    <rect x="8" y="34" width="8" height="9" fill="#475569"/>
    <rect x="7" y="36" width="10" height="6" fill="#1e293b"/>
  </g>
  <!-- Right Arm -->
  <g fill="#334155">
    <rect x="33" y="25" width="6" height="12"/>
    <rect x="32" y="34" width="8" height="9" fill="#475569"/>
    <rect x="31" y="36" width="10" height="6" fill="#1e293b"/>
  </g>

  <!-- Heavy Solid Stone Legs & Stance -->
  <g fill="#1e293b">
    <rect x="16" y="34" width="6" height="15"/>
    <rect x="15" y="45" width="8" height="6" fill="#334155"/>
    <rect x="14" y="49" width="10" height="4"/>
    <rect x="26" y="34" width="6" height="15"/>
    <rect x="25" y="45" width="8" height="6" fill="#334155"/>
    <rect x="24" y="49" width="10" height="4"/>
  </g>

  <!-- Stone Head & Glowing Optical Slits -->
  <g fill="#475569">
    <rect x="20" y="8" width="8" height="8"/>
    <rect x="19" y="9" width="10" height="6"/>
    <rect x="21" y="7" width="6" height="9" fill="#64748b"/>
  </g>
  <!-- Arcanite Glowing Eyes -->
  <g fill="#38bdf8" filter="url(#cyanGlow)">
    <rect x="21" y="11" width="2" height="1.5"/>
    <rect x="25" y="11" width="2" height="1.5"/>
    <rect x="21.5" y="11" width="1" height="1" fill="#ffffff"/>
    <rect x="25.5" y="11" width="1" height="1" fill="#ffffff"/>
  </g>
</svg>