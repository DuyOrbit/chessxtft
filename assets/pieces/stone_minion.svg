<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56" width="256" height="256" shape-rendering="crispEdges">
  <defs>
    <filter id="shardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#38bdf8" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- DUELYST II: ARCANITE SHARD DRONE (STONE MINION) - HOVERING PIXEL SPRITE -->

  <!-- Floating Crystalline Shards around Core -->
  <g fill="#38bdf8" filter="url(#shardGlow)">
    <!-- Top Crystal Horn -->
    <polygon points="24,10 21,18 27,18"/>
    <!-- Left Wing Shard -->
    <polygon points="12,24 18,22 18,28"/>
    <!-- Right Wing Shard -->
    <polygon points="36,24 30,22 30,28"/>
    <!-- Bottom Floating Point -->
    <polygon points="24,44 21,38 27,38"/>
  </g>

  <!-- Heavy Stone Core Body -->
  <g fill="#334155">
    <polygon points="24,16 34,26 24,38 14,26" fill="#1e293b"/>
    <polygon points="24,18 32,26 24,36 16,26" fill="#334155"/>
    <polygon points="24,20 30,26 24,34 18,26" fill="#475569"/>
  </g>

  <!-- Central Glowing Arcanite Eye / Power Reactor -->
  <g filter="url(#shardGlow)">
    <circle cx="24" cy="27" r="4.5" fill="#0284c7"/>
    <circle cx="24" cy="27" r="3" fill="#38bdf8"/>
    <circle cx="24" cy="27" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Dual Floating Spiked Claws -->
  <g fill="#64748b">
    <polygon points="13,32 15,42 17,34"/>
    <polygon points="35,32 33,42 31,34"/>
  </g>
</svg>