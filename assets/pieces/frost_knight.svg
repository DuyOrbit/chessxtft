<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56" width="256" height="256" shape-rendering="crispEdges">
  <defs>
    <filter id="iceKnightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#38bdf8" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- DUELYST II: GLACIAL FROST KNIGHT (FROST KNIGHT - VANAR FACTION) - HI-BIT PIXEL SPRITE -->

  <!-- Crystal Ice Kite Shield on Left Hand -->
  <g filter="url(#iceKnightGlow)">
    <polygon points="6,20 18,20 17,44 12,49 7,44" fill="#0c4a6e"/>
    <polygon points="7,21 17,21 16,43 12,47 8,43" fill="#0284c7"/>
    <polygon points="8,22 16,22 15,41 12,44 9,41" fill="#38bdf8"/>
    <!-- Snowflake Rune on Shield -->
    <rect x="11" y="24" width="2" height="16" fill="#e0f2fe"/>
    <rect x="8" y="28" width="8" height="2" fill="#e0f2fe"/>
    <rect x="11.5" y="28.5" width="1" height="1" fill="#ffffff"/>
  </g>

  <!-- Ice Plume on Helmet -->
  <g fill="#7dd3fc" filter="url(#iceKnightGlow)">
    <rect x="23" y="6" width="2" height="6"/>
    <rect x="24" y="8" width="3" height="4"/>
  </g>

  <!-- Glacial Plate Helm -->
  <rect x="21" y="12" width="8" height="9" fill="#0284c7"/>
  <rect x="20" y="13" width="10" height="7" fill="#0369a1"/>
  <!-- Glowing Eye Slit -->
  <rect x="22" y="15" width="6" height="2" fill="#ffffff" filter="url(#iceKnightGlow)"/>

  <!-- Ice Pauldrons -->
  <rect x="17" y="20" width="6" height="6" fill="#0284c7"/>
  <rect x="27" y="20" width="7" height="6" fill="#0284c7"/>
  <rect x="28" y="21" width="5" height="4" fill="#38bdf8"/>

  <!-- Chestplate with Ice Crystal Core -->
  <rect x="21" y="21" width="8" height="11" fill="#0369a1"/>
  <rect x="22" y="22" width="6" height="9" fill="#0284c7"/>
  <rect x="24" y="24" width="2" height="3" fill="#e0f2fe"/>

  <!-- Frost Lance / Spear in Right Hand -->
  <rect x="31" y="25" width="4" height="7" fill="#0369a1"/>
  <rect x="32" y="32" width="3" height="3" fill="#38bdf8"/>
  <!-- Ice Spear Shaft & Tip -->
  <rect x="36" y="8" width="2" height="42" fill="#0c4a6e"/>
  <g filter="url(#iceKnightGlow)">
    <polygon points="35,10 37,2 39,10" fill="#bae6fd"/>
    <polygon points="36,9 37,3 38,9" fill="#ffffff"/>
  </g>

  <!-- Plate Greaves & Boots -->
  <g fill="#075985">
    <rect x="20" y="35" width="5" height="13"/>
    <rect x="21" y="36" width="3" height="11" fill="#0284c7"/>
    <rect x="19" y="48" width="6" height="4" fill="#0c4a6e"/>
    <rect x="26" y="35" width="5" height="13"/>
    <rect x="27" y="36" width="3" height="11" fill="#0284c7"/>
    <rect x="26" y="48" width="6" height="4" fill="#0c4a6e"/>
  </g>
</svg>