<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56" width="256" height="256" shape-rendering="crispEdges">
  <defs>
    <filter id="bladeGlowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#ef4444" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- DUELYST II: SONGHAI BLADE ASSASSIN (CORSAIR) - HI-BIT PIXEL BATTLE SPRITE -->

  <!-- Flowing Red Ninja Scarf trailing behind -->
  <g fill="#dc2626">
    <rect x="27" y="16" width="8" height="3"/>
    <rect x="33" y="18" width="8" height="3"/>
    <rect x="39" y="20" width="6" height="3"/>
  </g>

  <!-- Dual Crimson Energy Katanas -->
  <!-- Left Katana -->
  <g filter="url(#bladeGlowRed)">
    <line x1="8" y1="12" x2="16" y2="34" stroke="#f87171" stroke-width="2"/>
    <line x1="8" y1="12" x2="16" y2="34" stroke="#ffffff" stroke-width="0.8"/>
    <rect x="15" y="33" width="3" height="3" fill="#ca8a04"/>
  </g>
  <!-- Right Katana -->
  <g filter="url(#bladeGlowRed)">
    <line x1="39" y1="12" x2="31" y2="34" stroke="#f87171" stroke-width="2"/>
    <line x1="39" y1="12" x2="31" y2="34" stroke="#ffffff" stroke-width="0.8"/>
    <rect x="30" y="33" width="3" height="3" fill="#ca8a04"/>
  </g>

  <!-- Shinobi Mask & Head -->
  <rect x="20" y="13" width="8" height="8" fill="#18181b"/>
  <rect x="19" y="14" width="10" height="6" fill="#27272a"/>
  <!-- Glowing Crimson Ninja Visor / Eye Slits -->
  <rect x="21" y="16" width="3" height="1.5" fill="#ef4444" filter="url(#bladeGlowRed)"/>
  <rect x="25" y="16" width="3" height="1.5" fill="#ef4444" filter="url(#bladeGlowRed)"/>

  <!-- Lightweight Assassin Gi & Sash -->
  <g fill="#18181b">
    <rect x="19" y="21" width="10" height="14"/>
    <rect x="20" y="22" width="8" height="12" fill="#27272a"/>
    <rect x="19" y="30" width="10" height="3" fill="#b91c1c"/>
  </g>

  <!-- Swift Stance Leg Greaves -->
  <g fill="#09090b">
    <rect x="18" y="35" width="4" height="13"/>
    <rect x="16" y="46" width="6" height="4" fill="#18181b"/>
    <rect x="26" y="35" width="4" height="13"/>
    <rect x="26" y="46" width="6" height="4" fill="#18181b"/>
  </g>
</svg>