<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56" width="256" height="256" shape-rendering="crispEdges">
  <defs>
    <filter id="archonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#38bdf8" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- DUELYST II: GRAND ARCHON COMMANDER (CHANCELLOR) - HI-BIT PIXEL BATTLE SPRITE -->

  <!-- Regal Armored Robes & High Collar -->
  <g fill="#1e293b">
    <rect x="18" y="22" width="12" height="22"/>
    <rect x="16" y="32" width="16" height="16"/>
  </g>
  <g fill="#475569">
    <rect x="20" y="24" width="8" height="20"/>
    <rect x="21" y="25" width="6" height="18" fill="#64748b"/>
    <!-- Golden Military Epaulets -->
    <rect x="14" y="20" width="6" height="4" fill="#f59e0b"/>
    <rect x="28" y="20" width="6" height="4" fill="#f59e0b"/>
  </g>

  <!-- Floating Tactical Hologram Map in Left Hand -->
  <g filter="url(#archonGlow)">
    <polygon points="12,24 8,28 14,32 18,28" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <rect x="10" y="27" width="2" height="2" fill="#38bdf8"/>
    <rect x="14" y="29" width="2" height="2" fill="#f59e0b"/>
  </g>

  <!-- Stern Commander Head & Golden Laurel Crown -->
  <rect x="21" y="12" width="7" height="8" fill="#fed7aa"/>
  <rect x="20" y="14" width="9" height="5" fill="#fde68a"/>
  <!-- Glowing Monocle Eye -->
  <rect x="22" y="15" width="2" height="1.5" fill="#38bdf8" filter="url(#archonGlow)"/>
  <rect x="25" y="15" width="1.5" height="1" fill="#334155"/>
  <!-- Golden Laurel Crown -->
  <rect x="20" y="10" width="9" height="2" fill="#f59e0b"/>
  <rect x="19" y="11" width="2" height="3" fill="#f59e0b"/>
  <rect x="28" y="11" width="2" height="3" fill="#f59e0b"/>

  <!-- Golden Sabre on Hip -->
  <line x1="29" y1="30" x2="36" y2="44" stroke="#ca8a04" stroke-width="2.5"/>
  <rect x="28" y="29" width="3" height="3" fill="#fde047"/>

  <!-- Polished Boots -->
  <g fill="#0f172a">
    <rect x="19" y="46" width="5" height="5"/>
    <rect x="25" y="46" width="5" height="5"/>
  </g>
</svg>