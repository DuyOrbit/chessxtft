<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56" width="256" height="256" shape-rendering="crispEdges">
  <defs>
    <filter id="divineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#f59e0b" flood-opacity="0.8"/>
    </filter>
    <filter id="bladeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#fbbf24" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- DUELYST II: PALADIN GENERAL (KING) - HI-BIT PIXEL BATTLE SPRITE -->

  <!-- Flowing White Cape Behind -->
  <g fill="#e2e8f0">
    <rect x="12" y="24" width="2" height="20"/>
    <rect x="14" y="22" width="20" height="22"/>
    <rect x="34" y="24" width="2" height="20"/>
    <rect x="13" y="44" width="22" height="3"/>
  </g>
  <!-- Cape Shadow & Gold Trim -->
  <g fill="#94a3b8">
    <rect x="14" y="32" width="4" height="12"/>
    <rect x="30" y="32" width="4" height="12"/>
    <rect x="14" y="44" width="20" height="2" fill="#d97706"/>
  </g>

  <!-- Golden Radiant Wings / Solar Crest behind Helmet -->
  <g fill="#f59e0b" filter="url(#divineGlow)">
    <rect x="16" y="8" width="2" height="5"/>
    <rect x="18" y="10" width="2" height="5"/>
    <rect x="28" y="10" width="2" height="5"/>
    <rect x="30" y="8" width="2" height="5"/>
    <rect x="22" y="5" width="4" height="5"/>
  </g>

  <!-- Winged Knight Great-Helm -->
  <!-- Helmet Base -->
  <rect x="20" y="12" width="8" height="9" fill="#fef08a"/>
  <rect x="19" y="13" width="10" height="7" fill="#fde047"/>
  <rect x="20" y="14" width="8" height="5" fill="#eab308"/>
  <!-- Glowing Cyan Visor Slit (Duelyst signature) -->
  <rect x="21" y="16" width="6" height="2" fill="#38bdf8"/>
  <rect x="23" y="16" width="2" height="1" fill="#ffffff"/>
  <!-- Helmet Crown Trim -->
  <rect x="20" y="11" width="8" height="2" fill="#ca8a04"/>
  <rect x="23" y="9" width="2" height="3" fill="#fef08a"/>

  <!-- Golden Pauldrons (Massive Lion Shoulders) -->
  <!-- Left Shoulder -->
  <rect x="13" y="20" width="7" height="7" fill="#fef08a"/>
  <rect x="12" y="21" width="9" height="5" fill="#eab308"/>
  <rect x="14" y="22" width="5" height="3" fill="#ca8a04"/>
  <!-- Right Shoulder -->
  <rect x="28" y="20" width="7" height="7" fill="#fef08a"/>
  <rect x="27" y="21" width="9" height="5" fill="#eab308"/>
  <rect x="29" y="22" width="5" height="3" fill="#ca8a04"/>

  <!-- Ornate Golden Breastplate -->
  <rect x="19" y="21" width="10" height="11" fill="#fef08a"/>
  <rect x="20" y="22" width="8" height="9" fill="#eab308"/>
  <!-- Cyan Core Gem (Lyonar Crest) -->
  <rect x="23" y="24" width="2" height="3" fill="#38bdf8"/>
  <rect x="23.5" y="24.5" width="1" height="1" fill="#ffffff"/>
  <!-- Armored Waist & Tassets -->
  <rect x="19" y="32" width="10" height="4" fill="#ca8a04"/>
  <rect x="22" y="32" width="4" height="5" fill="#fde047"/>

  <!-- Left Arm holding Sunblade Pommel -->
  <rect x="14" y="27" width="4" height="8" fill="#eab308"/>
  <rect x="15" y="34" width="3" height="3" fill="#ca8a04"/>

  <!-- Glowing Sunblade (Greatsword) -->
  <g filter="url(#bladeGlow)">
    <!-- Golden Crossguard -->
    <rect x="7" y="33" width="7" height="2" fill="#fde047"/>
    <rect x="9.5" y="32" width="2" height="4" fill="#ca8a04"/>
    <rect x="10" y="35" width="1" height="3" fill="#713f12"/>
    <circle cx="10.5" cy="38" r="1.5" fill="#fde047"/>
    <!-- Sunblade Glowing Blade -->
    <rect x="9" y="10" width="3" height="23" fill="#fef08a"/>
    <rect x="10" y="8" width="1" height="25" fill="#ffffff"/>
    <rect x="9.5" y="6" width="2" height="3" fill="#fef08a"/>
    <rect x="10" y="4" width="1" height="3" fill="#ffffff"/>
  </g>

  <!-- Right Arm with Armored Gauntlet -->
  <rect x="30" y="27" width="4" height="8" fill="#eab308"/>
  <rect x="31" y="34" width="3" height="4" fill="#fde047"/>

  <!-- Armored Greaves & Golden Boots (Standing Firm) -->
  <!-- Left Leg -->
  <rect x="18" y="36" width="5" height="12" fill="#ca8a04"/>
  <rect x="19" y="37" width="3" height="10" fill="#fde047"/>
  <rect x="17" y="48" width="6" height="4" fill="#eab308"/>
  <rect x="16" y="50" width="7" height="2" fill="#a16207"/>
  <!-- Right Leg -->
  <rect x="25" y="36" width="5" height="12" fill="#ca8a04"/>
  <rect x="26" y="37" width="3" height="10" fill="#fde047"/>
  <rect x="25" y="48" width="6" height="4" fill="#eab308"/>
  <rect x="25" y="50" width="7" height="2" fill="#a16207"/>

  <!-- Fine Dark Inking Outlines -->
  <g stroke="#1e1808" stroke-width="0.75" fill="none">
    <rect x="18" y="11" width="12" height="10"/>
    <rect x="12" y="20" width="9" height="7"/>
    <rect x="27" y="20" width="9" height="7"/>
    <rect x="19" y="21" width="10" height="15"/>
    <rect x="16" y="36" width="7" height="16"/>
    <rect x="25" y="36" width="7" height="16"/>
  </g>
</svg>