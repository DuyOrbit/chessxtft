<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56" width="256" height="256" shape-rendering="crispEdges">
  <defs>
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#7dd3fc" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- DUELYST II: GLACIAL FROST GOLEM (FROST ROOK - VANAR FACTION) - HI-BIT PIXEL SPRITE -->

  <!-- Ice Spikes on Shoulders -->
  <g fill="#bae6fd" filter="url(#iceGlow)">
    <polygon points="10,16 12,9 14,16"/>
    <polygon points="7,18 8,12 11,18"/>
    <polygon points="34,16 36,9 38,16"/>
    <polygon points="37,18 40,12 41,18"/>
  </g>

  <!-- Giant Glacial Shoulders (Pauldrons) -->
  <g fill="#0284c7">
    <rect x="8" y="16" width="9" height="9"/>
    <rect x="9" y="15" width="7" height="11"/>
    <rect x="10" y="17" width="5" height="7" fill="#38bdf8"/>
  </g>
  <g fill="#0284c7">
    <rect x="31" y="16" width="9" height="9"/>
    <rect x="32" y="15" width="7" height="11"/>
    <rect x="33" y="17" width="5" height="7" fill="#38bdf8"/>
  </g>

  <!-- Glacial Ice Torso -->
  <g fill="#0369a1">
    <rect x="16" y="16" width="16" height="18"/>
    <rect x="18" y="15" width="12" height="20"/>
    <rect x="17" y="17" width="14" height="16" fill="#0284c7"/>
  </g>

  <!-- Glowing Frost Runes & Crystalline Heart -->
  <g fill="#e0f2fe" filter="url(#iceGlow)">
    <!-- Central Power Core Gem -->
    <rect x="22" y="22" width="4" height="5"/>
    <rect x="23" y="23" width="2" height="3" fill="#ffffff"/>
    <!-- Ice Channels -->
    <rect x="20" y="24" width="2" height="1"/>
    <rect x="26" y="24" width="2" height="1"/>
    <rect x="19" y="22" width="1" height="4"/>
    <rect x="28" y="22" width="1" height="4"/>
    <rect x="23" y="27" width="2" height="4"/>
  </g>

  <!-- Heavy Glacial Arms & Fists -->
  <g fill="#0369a1">
    <rect x="9" y="25" width="6" height="12"/>
    <rect x="8" y="34" width="8" height="9" fill="#0284c7"/>
    <rect x="7" y="36" width="10" height="6" fill="#075985"/>
  </g>
  <g fill="#0369a1">
    <rect x="33" y="25" width="6" height="12"/>
    <rect x="32" y="34" width="8" height="9" fill="#0284c7"/>
    <rect x="31" y="36" width="10" height="6" fill="#075985"/>
  </g>

  <!-- Ice Legs & Solid Stance -->
  <g fill="#0c4a6e">
    <rect x="16" y="34" width="6" height="15"/>
    <rect x="15" y="45" width="8" height="6" fill="#0369a1"/>
    <rect x="14" y="49" width="10" height="4"/>
    <rect x="26" y="34" width="6" height="15"/>
    <rect x="25" y="45" width="8" height="6" fill="#0369a1"/>
    <rect x="24" y="49" width="10" height="4"/>
  </g>

  <!-- Glacial Head & Glowing Blue Eyes -->
  <g fill="#0284c7">
    <rect x="20" y="8" width="8" height="8"/>
    <rect x="19" y="9" width="10" height="6"/>
    <rect x="21" y="7" width="6" height="9" fill="#38bdf8"/>
  </g>
  <!-- Icy Glowing Eyes -->
  <g fill="#ffffff" filter="url(#iceGlow)">
    <rect x="21" y="11" width="2" height="1.5"/>
    <rect x="25" y="11" width="2" height="1.5"/>
  </g>
</svg>