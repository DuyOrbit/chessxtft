<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56" width="256" height="256" shape-rendering="crispEdges">
  <defs>
    <filter id="bowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#34d399" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- DUELYST II: STARLIGHT RANGER (ARCHER) - HI-BIT PIXEL BATTLE SPRITE -->

  <!-- Energy Recurve Bow in Left Hand -->
  <g filter="url(#bowGlow)">
    <!-- Bow Arc -->
    <path d="M 12 12 Q 6 28 12 44" fill="none" stroke="#10b981" stroke-width="2.5"/>
    <path d="M 12 12 Q 6 28 12 44" fill="none" stroke="#6ee7b7" stroke-width="1"/>
    <!-- Bowstring & Photon Arrow -->
    <line x1="12" y1="12" x2="22" y2="28" stroke="#a7f3d0" stroke-width="0.8"/>
    <line x1="12" y1="44" x2="22" y2="28" stroke="#a7f3d0" stroke-width="0.8"/>
    <!-- Drawn Energy Arrow -->
    <line x1="9" y1="28" x2="24" y2="28" stroke="#34d399" stroke-width="2"/>
    <line x1="9" y1="28" x2="24" y2="28" stroke="#ffffff" stroke-width="1"/>
    <polygon points="8,28 11,26 11,30" fill="#ffffff"/>
  </g>

  <!-- Hooded Ranger Silhouette -->
  <!-- Emerald Hood & Cloak -->
  <g fill="#065f46">
    <rect x="20" y="13" width="9" height="9"/>
    <rect x="19" y="14" width="11" height="7"/>
    <rect x="22" y="11" width="5" height="3" fill="#047857"/>
  </g>
  <!-- Glowing Eye Visor under Hood -->
  <rect x="22" y="17" width="4" height="2" fill="#34d399" filter="url(#bowGlow)"/>
  <rect x="23" y="17" width="2" height="1" fill="#ffffff"/>

  <!-- Leather Jerkin & Quiver Strap -->
  <g fill="#047857">
    <rect x="20" y="22" width="9" height="12"/>
    <rect x="21" y="23" width="7" height="10" fill="#059669"/>
    <!-- Leather Cross Strap -->
    <line x1="21" y1="23" x2="28" y2="33" stroke="#78350f" stroke-width="1.8"/>
  </g>

  <!-- Agility Boots & Stance -->
  <g fill="#064e3b">
    <rect x="20" y="34" width="4" height="14"/>
    <rect x="19" y="46" width="6" height="4" fill="#78350f"/>
    <rect x="26" y="34" width="4" height="14"/>
    <rect x="25" y="46" width="6" height="4" fill="#78350f"/>
  </g>
</svg>