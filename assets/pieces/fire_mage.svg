<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56" width="256" height="256" shape-rendering="crispEdges">
  <defs>
    <filter id="fireGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f97316" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- DUELYST II: CRIMSON PYROMANCER (FIRE MAGE - SONGHAI FACTION) - HI-BIT PIXEL SPRITE -->

  <!-- Flaming Hands & Swirling Embers -->
  <g filter="url(#fireGlow)">
    <!-- Left Hand Fire Orb -->
    <circle cx="12" cy="28" r="4.5" fill="#ea580c"/>
    <circle cx="12" cy="28" r="2.8" fill="#fde047"/>
    <circle cx="12" cy="28" r="1.2" fill="#ffffff"/>
    <polygon points="12,22 10,25 14,25" fill="#f97316"/>
    <!-- Right Hand Fire Orb -->
    <circle cx="36" cy="28" r="4.5" fill="#ea580c"/>
    <circle cx="36" cy="28" r="2.8" fill="#fde047"/>
    <circle cx="36" cy="28" r="1.2" fill="#ffffff"/>
    <polygon points="36,22 34,25 38,25" fill="#f97316"/>
  </g>

  <!-- Crimson & Obsidian Battle Robes -->
  <g fill="#7f1d1d">
    <rect x="18" y="22" width="12" height="20"/>
    <rect x="16" y="32" width="16" height="15"/>
    <rect x="15" y="44" width="18" height="7"/>
  </g>
  <!-- Volcanic Orange Trim -->
  <g fill="#c2410c">
    <rect x="22" y="24" width="4" height="24"/>
    <rect x="23" y="26" width="2" height="20" fill="#f97316"/>
  </g>

  <!-- Masked Pyromancer Hood & Glowing Amber Eyes -->
  <rect x="20" y="12" width="8" height="9" fill="#991b1b"/>
  <rect x="19" y="13" width="10" height="7" fill="#7f1d1d"/>
  <rect x="21" y="16" width="2" height="1.5" fill="#fde047" filter="url(#fireGlow)"/>
  <rect x="25" y="16" width="2" height="1.5" fill="#fde047" filter="url(#fireGlow)"/>

  <!-- Flaming Crown Horns above Hood -->
  <g fill="#f97316" filter="url(#fireGlow)">
    <polygon points="18,13 16,7 19,10"/>
    <polygon points="30,13 32,7 29,10"/>
    <polygon points="24,12 23,6 25,6"/>
  </g>
</svg>