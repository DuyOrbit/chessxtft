<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56" width="256" height="256" shape-rendering="crispEdges">
  <defs>
    <filter id="cannonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#38bdf8" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- DUELYST II: ASTRAL MANA SIEGE CANNON (CANNON) - HOVERING HI-BIT PIXEL SPRITE -->

  <!-- Floating Runic Platform Base with Stabilizer Repulsors -->
  <g fill="#1e293b">
    <rect x="12" y="38" width="24" height="6"/>
    <rect x="10" y="40" width="28" height="3"/>
  </g>
  <!-- Glowing Cyan Anti-Grav Repulsor Jets under platform -->
  <g fill="#38bdf8" filter="url(#cannonGlow)">
    <rect x="14" y="44" width="4" height="4"/>
    <rect x="30" y="44" width="4" height="4"/>
    <rect x="15" y="44" width="2" height="2" fill="#ffffff"/>
    <rect x="31" y="44" width="2" height="2" fill="#ffffff"/>
  </g>

  <!-- Twin Heavy Arcanite Energy Barrels (Tilted diagonally upward) -->
  <g fill="#334155">
    <!-- Left Barrel -->
    <rect x="15" y="16" width="6" height="22"/>
    <rect x="14" y="14" width="8" height="4" fill="#64748b"/>
    <!-- Right Barrel -->
    <rect x="27" y="16" width="6" height="22"/>
    <rect x="26" y="14" width="8" height="4" fill="#64748b"/>
  </g>

  <!-- Glowing Muzzle Apertures -->
  <g fill="#38bdf8" filter="url(#cannonGlow)">
    <rect x="16" y="14" width="4" height="2"/>
    <rect x="28" y="14" width="4" height="2"/>
    <rect x="17" y="14" width="2" height="1" fill="#ffffff"/>
    <rect x="29" y="14" width="2" height="1" fill="#ffffff"/>
  </g>

  <!-- Central Floating Mana Crystal Core between barrels -->
  <g filter="url(#cannonGlow)">
    <polygon points="24,20 20,28 24,36 28,28" fill="#0284c7"/>
    <polygon points="24,22 21,28 24,34 27,28" fill="#38bdf8"/>
    <circle cx="24" cy="28" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Brass Gear & Runic Housing -->
  <rect x="19" y="34" width="10" height="6" fill="#f59e0b"/>
  <rect x="22" y="35" width="4" height="4" fill="#ca8a04"/>
</svg>