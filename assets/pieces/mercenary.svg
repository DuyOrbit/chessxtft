<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56" width="256" height="256" shape-rendering="crispEdges">
  <defs>
    <filter id="roninGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#f59e0b" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- DUELYST II: RONIN BLADEMASTER (MERCENARY) - HI-BIT PIXEL BATTLE SPRITE -->

  <!-- Colossal Energy Greatsword rested on shoulder -->
  <g filter="url(#roninGlow)">
    <polygon points="10,6 16,4 32,22 28,26" fill="#1e293b"/>
    <polygon points="12,8 15,6 30,22 27,25" fill="#f59e0b"/>
    <polygon points="13,9 14,7 28,22 26,24" fill="#ffffff"/>
    <line x1="28" y1="26" x2="34" y2="34" stroke="#ca8a04" stroke-width="2.5"/>
  </g>

  <!-- Flowing Ronin Cloak & High Scarf -->
  <g fill="#334155">
    <rect x="18" y="22" width="12" height="20"/>
    <rect x="16" y="32" width="16" height="16"/>
  </g>
  <!-- Scarf covering lower face -->
  <rect x="20" y="16" width="8" height="5" fill="#f59e0b"/>
  <rect x="21" y="17" width="6" height="3" fill="#ca8a04"/>

  <!-- Ronin Head & Glowing Lone Eye -->
  <rect x="20" y="12" width="8" height="6" fill="#1e293b"/>
  <!-- Glowing Amber Eye Slit -->
  <rect x="24" y="15" width="2" height="1.5" fill="#fde047" filter="url(#roninGlow)"/>

  <!-- Armored Greaves & Stance -->
  <g fill="#1e293b">
    <rect x="19" y="36" width="4" height="13"/>
    <rect x="18" y="47" width="6" height="4" fill="#0f172a"/>
    <rect x="25" y="36" width="4" height="13"/>
    <rect x="24" y="47" width="6" height="4" fill="#0f172a"/>
  </g>
</svg>