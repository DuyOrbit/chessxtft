<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56" width="256" height="256" shape-rendering="crispEdges">
  <defs>
    <filter id="pawnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#38bdf8" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- DUELYST II: IRON VANGUARD (SHIELD PAWN) - HI-BIT PIXEL BATTLE SPRITE -->

  <!-- Heavy Heater Shield in Left Hand -->
  <g filter="url(#pawnGlow)">
    <polygon points="8,22 18,22 16,42 13,46 10,42" fill="#1e293b"/>
    <polygon points="9,23 17,23 15,40 13,44 11,40" fill="#475569"/>
    <!-- Iron Boss & Rivets -->
    <circle cx="13" cy="30" r="2.5" fill="#94a3b8"/>
    <circle cx="13" cy="30" r="1" fill="#ffffff"/>
  </g>

  <!-- Iron Kettle Helmet -->
  <rect x="21" y="14" width="8" height="8" fill="#475569"/>
  <rect x="20" y="15" width="10" height="6" fill="#64748b"/>
  <rect x="19" y="18" width="12" height="2" fill="#334155"/>
  <!-- Glowing Eye Slits -->
  <rect x="22" y="17" width="2" height="1" fill="#38bdf8"/>
  <rect x="26" y="17" width="2" height="1" fill="#38bdf8"/>

  <!-- Iron Brigandine Armor & Belt -->
  <rect x="20" y="22" width="10" height="12" fill="#334155"/>
  <rect x="21" y="23" width="8" height="10" fill="#475569"/>
  <rect x="20" y="32" width="10" height="3" fill="#1e293b"/>
  <rect x="24" y="32" width="2" height="3" fill="#ca8a04"/>

  <!-- Right Arm with Arming Sword -->
  <rect x="31" y="25" width="4" height="6" fill="#475569"/>
  <rect x="32" y="30" width="3" height="3" fill="#94a3b8"/>
  <rect x="34" y="18" width="2" height="16" fill="#cbd5e1"/>
  <rect x="34.5" y="16" width="1" height="18" fill="#ffffff"/>
  <rect x="33" y="30" width="4" height="2" fill="#94a3b8"/>

  <!-- Chainmail Skirt & Greaves -->
  <g fill="#334155">
    <rect x="20" y="36" width="4" height="12"/>
    <rect x="21" y="37" width="2" height="10" fill="#64748b"/>
    <rect x="19" y="47" width="6" height="4"/>
    <rect x="26" y="36" width="4" height="12"/>
    <rect x="27" y="37" width="2" height="10" fill="#64748b"/>
    <rect x="25" y="47" width="6" height="4"/>
  </g>
</svg>